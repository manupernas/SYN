name: SYN 1.0 macOS DMG (experimental)
on:
  workflow_dispatch:
  push:
    branches: [macos]
    paths:
      - macos/**
      - .github/workflows/build-macos-dmg.yml
permissions:
  contents: read
jobs:
  dmg-arm64:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout branch macos
        uses: actions/checkout@v4
      - name: Check architecture
        run: |
          test "$(uname -m)" = arm64
          xcode-select -p
      - name: Install GTK/libmpv runtime (development package)
        run: |
          brew update
          brew install python@3.15 gtk4 libadwaita mpv glib gobject-introspection pygobject3 py3cairo ffmpeg
      - name: Build SYN 1.0 experimental DMG
        run: bash macos/build_dev_dmg.sh
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYN-1.0-macOS-arm64-experimental
          path: dist/SYN-1.0-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 30
