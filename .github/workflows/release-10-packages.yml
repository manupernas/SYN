name: SYN · 6 native packages + 2 Flathub Flatpaks + GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: syn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate source and release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test tooling
        run: sudo apt-get update && sudo apt-get install -y python3-pytest
      - name: Compile Python and run release checks
        run: |
          set -euo pipefail
          python3 -m compileall -q synplus_layout.py syn.py syn_catalog.py syn_poster.py syn_dvr.py syn_service_setup.py syn_sources.py syn_i18n.py syn_cast_autostart.py syn_multistream.py syn_reconnect.py syn_timeshift.py syn_fav_sort.py syn_cast_host.py syn_nord_palette.py syn_gruvbox_palette.py syn_fallback_art.py syn_epg_pop.py syn_settings_rev3.py syn_locale_rev3.py
          python3 -m pytest -q tests/test_synplus_200.py tests/test_syn_201.py tests/test_syn_202.py tests/test_syn_203.py tests/test_syn_204.py tests/test_syn_205.py tests/test_syn_206.py tests/test_syn_dvr_release.py tests/test_syn_service_setup.py tests/test_syn_release_132.py tests/test_syn_release_133.py tests/test_syn_cast_plug_play.py tests/test_syn_cast_133.py tests/test_syn_release_134.py tests/test_syn_release_135.py tests/test_syn_release_136.py tests/test_syn_theme_popovers.py tests/test_syn_release_137.py tests/test_syn_branding_137_hotfix.py
          bash -n packaging/build-native.sh packaging/build-flatpak.sh packaging/stage-native.sh
          python3 packaging/prepare-release.py --self-test
      - name: Determine release version from SYN_VERSION and validate tag
        id: release_meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYRELEASE'
          import os
          import re
          from pathlib import Path
          src = Path('syn.py').read_text(encoding='utf-8')
          match = re.search(r'^SYN_VERSION\s*=\s*[\'\"]([^\'\"]+)', src, re.M)
          if not match:
              raise SystemExit('SYN_VERSION missing from syn.py')
          version = match.group(1)
          if re.fullmatch(r'\d+\.\d+', version):
              version += '.0'
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Invalid SYN_VERSION: ' + version)
          tag = 'v' + version
          if os.environ['REF_TYPE'] == 'tag' and os.environ['REF_NAME'] != tag:
              raise SystemExit('Tag/source mismatch: expected ' + tag + ', received ' + os.environ['REF_NAME'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print('version=' + version, file=output)
              print('tag=' + tag, file=output)
          print('SYN release version:', version)
          PYRELEASE
      - name: Ensure no private IPTV or recording data is tracked
        run: |
          if git ls-files | grep -Ei '(^|/)(profiles\.json|dvr\.json|.*\.(m3u|m3u8|mkv|mp4|ts))$'; then
            echo 'Private playlists, credentials or recordings are tracked' >&2
            exit 1
          fi

  build_native:
    name: Native ${{ matrix.format }} / ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        format: [rpm, deb, pacman]
        arch: [x86_64, aarch64]
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native CPU architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Install native packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm libarchive-tools zstd
          sudo gem install --no-document fpm -v 1.18.0
      - name: Build native package
        run: bash packaging/build-native.sh '${{ matrix.format }}' "$RELEASE_VERSION" '${{ matrix.arch }}'
      - name: Validate package
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -size +1024c | wc -l)" -eq 1
          ls -lh dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: syn-${{ matrix.format }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build_flatpak_flathub:
    name: Flathub GNOME 49 Flatpak / ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native CPU architecture (no emulation)
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Set up Python for the GNOME 49 SDK wheelhouse
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download architecture-specific PyChromecast wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging/flatpak-cast-wheels
          python3 -m pip download --disable-pip-version-check \
            --only-binary=:all: --python-version 3.13 \
            --implementation cp --abi cp313 \
            --platform 'manylinux2014_${{ matrix.arch }}' --platform any \
            --dest packaging/flatpak-cast-wheels 'pychromecast==14.0.10'
      - name: Build Flatpak inside the Flathub GNOME 49 image
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: com.mrseivane.Syn.yml
          bundle: SYN-${{ env.RELEASE_VERSION }}-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          branch: master
          cache: true
          build-bundle: true
          upload-artifact: false
      - name: Validate Flatpak output
        shell: bash
        run: |
          set -euo pipefail
          f="SYN-${RELEASE_VERSION}-${{ matrix.arch }}.flatpak"
          test -s "$f"
          test "$(wc -c < "$f")" -gt 1024
          ls -lh "$f"
      - uses: actions/upload-artifact@v4
        with:
          name: syn-flatpak-${{ matrix.arch }}
          path: SYN-${{ env.RELEASE_VERSION }}-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish exactly 8 packages and SHA256
    needs: [verify, build_native, build_flatpak_flathub]
    if: ${{ github.ref_type == 'tag' && needs.verify.result == 'success' && needs.build_native.result == 'success' && needs.build_flatpak_flathub.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: syn-*
          path: release-assets
          merge-multiple: true
      - name: Verify all eight packages, calculate checksums and render English notes
        env:
          SYN_RELEASE_VERSION: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="docs/RELEASE_${RELEASE_VERSION}.md"
          test -s "$NOTES"
          python3 packaging/prepare-release.py release-assets "$NOTES" release-body.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SYN ${{ needs.verify.outputs.version }} · Linux (x86_64 and ARM64)
          body_path: release-body.md
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: false
          draft: false
