name: SYN · 8 Linux packages + GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: syn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate source and release metadata
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install test tooling
        run: sudo apt-get update && sudo apt-get install -y python3-pytest
      - name: Compile Python and run release checks
        run: |
          set -euo pipefail
          python3 -m compileall -q syn.py syn_dvr.py syn_dvr_tray.py syn_sources.py syn_i18n.py
          python3 -m pytest -q tests/test_syn_dvr_release.py tests/test_syn_service_setup.py tests/test_syn_release_132.py
          bash -n packaging/build-native.sh packaging/build-flatpak.sh packaging/stage-native.sh
          python3 packaging/prepare-release.py --self-test
      - name: Determine release version from SYN_VERSION and validate tag
        id: release_meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYRELEASE'
          import os
          import re
          from pathlib import Path

          src = Path('syn.py').read_text(encoding='utf-8')
          match = re.search(r'^SYN_VERSION\s*=\s*[\'"]([^\'"]+)', src, re.M)
          if not match:
              raise SystemExit('SYN_VERSION missing from syn.py')
          version = match.group(1)
          if re.fullmatch(r'\d+\.\d+', version):
              version += '.0'
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Invalid SYN_VERSION: ' + version)
          tag = 'v' + version
          if os.environ['REF_TYPE'] == 'tag' and os.environ['REF_NAME'] != tag:
              raise SystemExit('Tag/source mismatch: expected ' + tag +
                               ', received ' + os.environ['REF_NAME'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print('version=' + version, file=output)
              print('tag=' + tag, file=output)
          print('SYN release version:', version)
          PYRELEASE
      - name: Ensure no private IPTV or recording data is tracked
        run: |
          if git ls-files | grep -Ei '(^|/)(profiles\.json|dvr\.json|.*\.(m3u|m3u8|mkv|mp4|ts))$'; then
            echo 'Private playlists, credentials or recordings are tracked' >&2
            exit 1
          fi

  build:
    name: ${{ matrix.format }} / ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        format: [rpm, deb, pacman, flatpak]
        arch: [x86_64, aarch64]
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          echo 'Native CPU:' "$(uname -m)"
          df -h .
      - name: Install native packaging tools
        if: matrix.format != 'flatpak'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm libarchive-tools zstd
          sudo gem install --no-document fpm -v 1.18.0
      - name: Build native package
        if: matrix.format != 'flatpak'
        run: bash packaging/build-native.sh '${{ matrix.format }}' "$RELEASE_VERSION" '${{ matrix.arch }}'
      - name: Install Flatpak packaging tools
        if: matrix.format == 'flatpak'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder git
          flatpak --version
          flatpak-builder --version
      - name: Build native-architecture Flatpak bundle
        if: matrix.format == 'flatpak'
        run: bash packaging/build-flatpak.sh "$RELEASE_VERSION" '${{ matrix.arch }}'
      - name: Validate output count and nonempty package
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          find dist -maxdepth 1 -type f -printf '%f\t%k KiB\n'
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -size +1024c | wc -l)" -eq 1
          ls -lh dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: syn-${{ matrix.format }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish all 8 packages and SHA256
    needs: [verify, build]
    if: ${{ github.ref_type == 'tag' && needs.verify.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: syn-*
          path: release-assets
          merge-multiple: true
      - name: Require exactly 8 complete assets; create checksums and English notes
        env:
          SYN_RELEASE_VERSION: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="docs/RELEASE_${RELEASE_VERSION}.md"
          if [[ ! -f "$NOTES" ]]; then
            NOTES="release-notes-generated.md"
            printf '# SYN %s — Linux release\n\nEight architecture-specific Linux packages: RPM, DEB, Pacman and Flatpak for x86_64 and ARM64.\n' "$RELEASE_VERSION" > "$NOTES"
          fi
          python3 packaging/prepare-release.py release-assets "$NOTES" release-body.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SYN ${{ needs.verify.outputs.version }} · Linux (x86_64 and ARM64)
          body_path: release-body.md
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: false
          draft: false
