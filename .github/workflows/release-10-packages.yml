name: SYN · 6 nativos obligatorios + 4 opcionales

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: syn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas previas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de tests
        run: sudo apt-get update && sudo apt-get install -y python3-pytest
      - name: Compilar Python y ejecutar pruebas DVR
        run: |
          python3 -m compileall -q syn.py syn_dvr.py syn_sources.py syn_i18n.py
          python3 -m pytest -q tests/test_syn_dvr_release.py
      - name: Sin datos privados
        run: |
          if git ls-files | grep -Ei '(^|/)(profiles\.json|dvr\.json|.*\.(m3u|m3u8|mkv|mp4|ts))$'; then
            echo 'ERROR: datos privados incluidos en el repositorio' >&2
            exit 1
          fi

  build:
    name: ${{ matrix.format }} · ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        format: [rpm, deb, pacman]
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Leer versión de SYN
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python3 - <<'PY'
          import pathlib, re
          s=pathlib.Path('syn.py').read_text()
          print(re.search(r'^SYN_VERSION\s*=\s*["\x27]([0-9]+\.[0-9]+\.[0-9]+)',s,re.M).group(1))
          PY
          )"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Comprobar versión del código y etiqueta
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          s=pathlib.Path('syn.py').read_text()
          m=re.search(r'^SYN_VERSION\s*=\s*["\x27]([0-9]+\.[0-9]+\.[0-9]+)',s,re.M)
          assert m and m.group(1)==os.environ['VERSION'],'El tag no coincide con SYN_VERSION'
          PY
      - name: Instalar herramientas de empaquetado nativo
        if: matrix.format == 'rpm' || matrix.format == 'deb' || matrix.format == 'pacman'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm libarchive-tools zstd
          sudo gem install --no-document fpm -v 1.18.0
      - name: Construir RPM/DEB/Pacman
        if: matrix.format == 'rpm' || matrix.format == 'deb' || matrix.format == 'pacman'
        run: bash packaging/build-native.sh '${{ matrix.format }}' "$VERSION" '${{ matrix.arch }}'
      - name: Instalar herramientas Flatpak
        if: matrix.format == 'flatpak'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder git
      - name: Compilar Flatpak nativo
        if: matrix.format == 'flatpak'
        run: bash packaging/build-flatpak.sh "$VERSION" '${{ matrix.arch }}'
      - name: Instalar dependencias AppImage GTK4
        if: matrix.format == 'appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 libmpv2 ffmpeg \
            libglib2.0-bin gdk-pixbuf2.0-bin librsvg2-common \
            libarchive-tools patchelf binutils file curl zstd
      - name: Crear y comprobar AppImage
        if: matrix.format == 'appimage'
        run: bash packaging/build-appimage.sh "$VERSION" '${{ matrix.arch }}'
      - name: Comprobar salidas
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -printf '%f\t%k KB\n'
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -size +1024c | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: syn-${{ matrix.format }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-optional:
    name: Opcional · ${{ matrix.format }} · ${{ matrix.arch }}
    needs: test
    # Fallar aquí NO bloquea una Release si los seis nativos están bien.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        format: [flatpak, appimage]
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Leer versión de SYN
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python3 - <<'PY'
          import pathlib, re
          s=pathlib.Path('syn.py').read_text()
          print(re.search(r'^SYN_VERSION\s*=\s*["\x27]([0-9]+\.[0-9]+\.[0-9]+)',s,re.M).group(1))
          PY
          )"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Comprobar versión del código y etiqueta
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          s=pathlib.Path('syn.py').read_text()
          m=re.search(r'^SYN_VERSION\s*=\s*["\x27]([0-9]+\.[0-9]+\.[0-9]+)',s,re.M)
          assert m and m.group(1)==os.environ['VERSION'],'El tag no coincide con SYN_VERSION'
          PY
      - name: Instalar herramientas de empaquetado nativo
        if: matrix.format == 'rpm' || matrix.format == 'deb' || matrix.format == 'pacman'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm libarchive-tools zstd
          sudo gem install --no-document fpm -v 1.18.0
      - name: Construir RPM/DEB/Pacman
        if: matrix.format == 'rpm' || matrix.format == 'deb' || matrix.format == 'pacman'
        run: bash packaging/build-native.sh '${{ matrix.format }}' "$VERSION" '${{ matrix.arch }}'
      - name: Instalar herramientas Flatpak
        if: matrix.format == 'flatpak'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder git
      - name: Compilar Flatpak nativo
        if: matrix.format == 'flatpak'
        run: bash packaging/build-flatpak.sh "$VERSION" '${{ matrix.arch }}'
      - name: Instalar dependencias AppImage GTK4
        if: matrix.format == 'appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 libmpv2 ffmpeg \
            libglib2.0-bin gdk-pixbuf2.0-bin librsvg2-common \
            libarchive-tools patchelf binutils file curl zstd
      - name: Crear y comprobar AppImage
        if: matrix.format == 'appimage'
        run: bash packaging/build-appimage.sh "$VERSION" '${{ matrix.arch }}'
      - name: Comprobar salidas
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -printf '%f\t%k KB\n'
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -size +1024c | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: syn-${{ matrix.format }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar GitHub Release y SHA256
    needs: [test, build, build-optional]
    if: ${{ always() && github.ref_type == 'tag' && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: syn-*
          path: release-assets
          merge-multiple: true
      - name: Exigir seis nativos y seleccionar Flatpak/AppImage por parejas
        shell: bash
        env:
          SYN_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 packaging/prepare-release.py release-assets docs/RELEASE_1.2.2.md release-body.md
      - name: Publicar Release con notas
        uses: softprops/action-gh-release@v3
        with:
          name: SYN DVR ${{ github.ref_name }} · Linux (x86_64 + ARM64)
          body_path: release-body.md
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: false
