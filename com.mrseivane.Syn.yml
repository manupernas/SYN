# SYN 3.6 · GTK4 único · Receta Flatpak para aarch64/x86_64
# Compilar separadamente en x86_64 y aarch64; sin dependencias binarias del host.
id: com.mrseivane.Syn
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: syn-flatpak
finish-args:
  - --share=network
  - --talk-name=org.freedesktop.Flatpak
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-videos:create
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-download:ro
  # Los perfiles nativos de SYN 2.1 se comparten con Flatpak para migrar sin copiar claves.
  - --filesystem=xdg-config/syn:create
  # CSS GTK4 del anfitrión; acceso de solo lectura para conservar Colloid/Terafox.
  - --filesystem=xdg-config/gtk-4.0:ro
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-config/kdeglobals:ro
  - --filesystem=~/.themes:ro
  - --filesystem=xdg-data/themes:ro
  - --filesystem=xdg-cache/syn:create
  - --env=LC_NUMERIC=C
modules:
  - name: syn-x264
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --enable-shared --disable-cli --disable-opencl
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: a8b68ebfaa68621b5ac8907610d3335971839d52
  - name: syn-ffmpeg
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --enable-shared --disable-static --enable-ffmpeg --disable-ffplay --disable-ffprobe --disable-doc --enable-gnutls --enable-pic --enable-gpl --enable-libx264
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n7.1.3
  - name: syn-libplacebo
    buildsystem: meson
    config-opts:
      - -Dopengl=enabled
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
      - -Ddemos=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
  # Necesaria para los subtítulos/OSD de mpv; no está incluida en el SDK.
  - name: syn-libass
    buildsystem: meson
    config-opts:
      - -Dfontconfig=enabled
      - -Dlibunibreak=disabled
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: '0.17.5'
  - name: syn-libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Dplain-gl=enabled
      - -Dvulkan=disabled
      - -Dx11=disabled
      - -Dwayland=disabled
      - -Ddrm=disabled
      - -Dalsa=disabled
      - -Dmanpage-build=disabled
      - -Dbuild-date=false
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
  - name: syn
    buildsystem: simple
    build-commands:
      - install -Dm755 syn-flatpak /app/bin/syn-flatpak
      - install -Dm755 syn.py /app/share/syn/syn.py
      - install -Dm644 syn_dvr.py /app/share/syn/syn_dvr.py
      - install -Dm644 syn_service_setup.py /app/share/syn/syn_service_setup.py
      - install -Dm755 syn-dvr-worker /app/bin/syn-dvr-worker
      - install -Dm644 syn_sources.py /app/share/syn/syn_sources.py
      - install -Dm644 syn_catalog.py /app/share/syn/syn_catalog.py
      - install -Dm644 syn_poster.py /app/share/syn/syn_poster.py
      - install -Dm644 syn_i18n.py /app/share/syn/syn_i18n.py
      - install -Dm644 syn_favoritos.py /app/share/syn/syn_favoritos.py
      - install -Dm644 syn_fav_sort.py /app/share/syn/syn_fav_sort.py
      - install -Dm644 syn_multistream.py /app/share/syn/syn_multistream.py
      - install -Dm644 syn_reconnect.py /app/share/syn/syn_reconnect.py
      - install -Dm644 syn_timeshift.py /app/share/syn/syn_timeshift.py
      - install -Dm644 syn_cast_host.py /app/share/syn/syn_cast_host.py
      - install -Dm644 syn_cast_autostart.py /app/share/syn/syn_cast_autostart.py
      - install -Dm755 syn-cast-bridge /app/bin/syn-cast-bridge
      # Wheels for the native SDK Python are fetched BEFORE flatpak-builder.
      # Neither the build sandbox nor a user's host needs network/pip installs.
      - python3 -m pip install --no-index --disable-pip-version-check --find-links=packaging/flatpak-cast-wheels --target=/app/share/syn/vendor pychromecast==14.0.10
      - install -Dm644 syn_idle_screen.png /app/share/syn/syn_idle_screen.png
      - mkdir -p /app/share/syn/branding
      - cp branding/*.png /app/share/syn/branding/
      - install -Dm755 instalar-servicio-cast.sh /app/share/syn/instalar-servicio-cast.sh
      - install -Dm644 syn_settings_rev3.py /app/share/syn/syn_settings_rev3.py
      - install -Dm644 syn_locale_rev3.py /app/share/syn/syn_locale_rev3.py
      - install -Dm644 syn_fallback_art.py /app/share/syn/syn_fallback_art.py
      - install -Dm644 syn_nord_palette.py /app/share/syn/syn_nord_palette.py
      - install -Dm644 syn_epg_pop.py /app/share/syn/syn_epg_pop.py
      - install -Dm644 syn_gruvbox_palette.py /app/share/syn/syn_gruvbox_palette.py
      - install -Dm644 locale/en_US/LC_MESSAGES/syn.mo /app/share/locale/en_US/LC_MESSAGES/syn.mo
      - install -Dm644 locale/en_GB/LC_MESSAGES/syn.mo /app/share/locale/en_GB/LC_MESSAGES/syn.mo
      - install -Dm644 com.mrseivane.Syn.desktop /app/share/applications/com.mrseivane.Syn.desktop
      - install -Dm644 com.mrseivane.Syn.metainfo.xml /app/share/metainfo/com.mrseivane.Syn.metainfo.xml
      - mkdir -p /app/share/icons/hicolor
      - cp -r icons/* /app/share/icons/hicolor/
    sources:
      - type: dir
        path: .
